name: Build FrankenPHP images

on:
  push:
    branches: [main]
    paths:
      - docker-bake.hcl
      - Dockerfile
      - frankenphp/**
      - tests/**
      - .github/workflows/build.yml
  # No paths filter: the "CI result" job is a required check and must report on every PR.
  # The changes job decides whether the image builds run.
  pull_request:
  # Weekly rebuild to pick up OS package updates
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Also read by docker-bake.hcl
  REPO_BASE: ghcr.io/requirecloud/frankenphp
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:

  # On PRs, build only when image files changed; other events always build
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            build=true
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -qE '^(docker-bake\.hcl|Dockerfile|frankenphp/|tests/|\.github/workflows/build\.yml)'; then
            build=true
          else
            build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  # Build each target natively per arch, run tests and push the image by digest
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [php-84, php-85, php-86, drupal-84, drupal-85, drupal-dev-84, drupal-dev-85]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build loads the image for testing and pushes the same image untagged by digest.
      # It only gets tagged in the merge job, after tests on all arches have passed.
      - name: Build image
        run: |
          # Image repository of the target, e.g. ghcr.io/requirecloud/frankenphp-drupal
          repo=$(docker buildx bake -f docker-bake.hcl --print "$TARGET" | jq -r --arg t "$TARGET" '.target[$t].tags[0] | sub(":[^:]+$"; "")')
          outputs=(--set "$TARGET.output=type=docker,name=frankenphp-test:$TARGET")
          if [[ "$PUSH" == "true" ]]; then
            outputs+=(--set "$TARGET.output=type=image,name=$repo,push-by-digest=true,name-canonical=true,push=true")
          fi
          docker buildx bake -f docker-bake.hcl "$TARGET" --pull --no-cache \
            --set "$TARGET.platform=linux/$ARCH" \
            --set "$TARGET.tags=" \
            "${outputs[@]}" \
            --metadata-file metadata.json

      - name: Run tests
        run: |
          case "$TARGET" in
            drupal-dev-*) args=(drupal drupal-dev) ;;
            drupal-*) args=(drupal) ;;
            *) args=() ;;
          esac
          docker run --rm -v "$PWD/tests:/app" "frankenphp-test:$TARGET" /app/tests.sh "${args[@]}"

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"]' metadata.json)
          mkdir -p digests
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine per-arch digests into multi-arch manifests with the tags from docker-bake.hcl
  merge:
    name: Merge ${{ matrix.target }}
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [php-84, php-85, php-86, drupal-84, drupal-85, drupal-dev-84, drupal-dev-85]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.target }}-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          mapfile -t tags < <(docker buildx bake -f docker-bake.hcl --print "$TARGET" | jq -r --arg t "$TARGET" '.target[$t].tags[] | "--tag=" + .')
          repo=$(docker buildx bake -f docker-bake.hcl --print "$TARGET" | jq -r --arg t "$TARGET" '.target[$t].tags[0] | sub(":[^:]+$"; "")')
          mapfile -t sources < <(find digests -type f -printf "$repo@sha256:%f\n")
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: |
          tag=$(docker buildx bake -f docker-bake.hcl --print "$TARGET" | jq -r --arg t "$TARGET" '.target[$t].tags[0]')
          docker buildx imagetools inspect "$tag"

  # The single required status check: passes when all builds passed or were skipped (no image changes)
  result:
    name: CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check build results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES build=$BUILD"
          [[ "$CHANGES" == "success" && ( "$BUILD" == "success" || "$BUILD" == "skipped" ) ]]
